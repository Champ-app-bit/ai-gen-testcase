# โปรเจกต์ WNW — เว็บสั่งพวงหรีดออนไลน์ (หรีด ณ วัด / Wreath Na Wat)
name: WNW
domain: "เว็บ e-commerce สั่งพวงหรีดออนไลน์ (หรีด ณ วัด / Wreath Na Wat) — frontend Next.js, มี backend แยก"
lang: th
tc_prefix: TC

# repo ที่จะ clone มา ground (auth ผ่าน env AZURE_DEVOPS_PAT — ไม่ฝัง PAT ใน url)
# branch: null = ใช้ default branch ของ repo
repos:
  - name: frontend
    url: https://dev.azure.com/app-bit/WNW/_git/frontend
    branch: null
    framework: "Next.js / React (TypeScript)"
  - name: backend
    url: https://dev.azure.com/app-bit/WNW/_git/backend
    branch: null
    framework: "backend (business rules / API)"

# (optional) RAG เอกสาร spec/requirement — ground คู่กับโค้ด (dual grounding)
# path: โฟลเดอร์ในเครื่องที่เก็บ requirement (PDF/md/txt); comment ออก = ปิด ใช้เฉพาะโค้ด
docs:
  path: ./docs/wnw          # วาง requirement ไว้ที่นี่ (relative กับโฟลเดอร์โปรเจกต์)
  ext: [.pdf, .md, .txt]

# ─────────────────────────────────────────────────────────────────────
# 3-way grounding สำหรับ "วิธี A" (/gen-testcases บน Claude Code — ไม่เรียก API)
# ⚠️ path จริงของ repo ในเครื่อง อยู่ใน projects/wnw.local.yaml (สร้างโดย /setup wnw)
#    ไฟล์นี้เก็บแค่ส่วน "portable" (remote URL + area mapping) เพื่อ commit ได้
# ─────────────────────────────────────────────────────────────────────

# git remote ของ repo ที่เกี่ยว (ไว้ให้ /setup เสนอ clone ถ้าเครื่องยังไม่มี)
remotes:
  code:
    - https://dev.azure.com/app-bit/WNW/_git/frontend
    - https://dev.azure.com/app-bit/WNW/_git/backend
  automation: https://dev.azure.com/app-bit/WNW/_git/automation_wnw_robot   # ปรับตามจริง

# เทสที่ automate แล้ว — convention + area mapping (portable, ไม่มี path เครื่อง)
automation:
  framework: robot
  # convention repo (ให้เคสใหม่ทำตามนี้):
  #   1 เคส/ไฟล์ · ชื่อ TC-<AREA>-<NN>_<slug>.robot · จัดใต้ tests/<feature>/<subfeature>/
  #   Tags: feature:<x> group:<y> [type:<z>] + TC-ID · Documentation มี "Evidence: file:line"
  # schema: <module>: { dir: <path relative จาก automation.path>, prefix: TC-<AREA> }
  # ⚠️ WNW: automation.path ชี้ ".../tests" อยู่แล้ว → dir จึงเป็น path ต่อจาก tests/
  #    (ต่าง ERP/INVENTORY/WRE ที่ path ชี้ราก repo แล้ว dir = <suite>/tests) — กติกาเดียวกันคือ
  #    "dir เป็น relative จาก automation.path เสมอ"
  areas:                                    # map ฟีเจอร์ → โฟลเดอร์ + prefix (ช่วยหา/ตั้งเลขต่อ)
    register: { dir: auth/register, prefix: TC-REG }
    login:    { dir: auth/login,    prefix: TC-LOGIN }
    forget:   { dir: auth/forget,   prefix: TC-FGT }
    checkout: { dir: checkout,      prefix: TC-CHK }
    cart:     { dir: cart,          prefix: TC-CART }
    payment:  { dir: payment,       prefix: TC-PAY }
    tracking: { dir: tracking,      prefix: TC-TRK }

# ─────────────────────────────────────────────────────────────────────
# discovery — บอก /module-scout ว่า "module ของ stack นี้อยู่ตรงไหน" (portable, ไม่มี path เครื่อง)
# ยืนยันแล้ว 2026-08-26: FE src/app/* = 39 route · BE Laravel 2 app (web 20 Controller · erp 17)
# ─────────────────────────────────────────────────────────────────────
discovery:
  modules:
    - { side: fe, root_match: frontend, glob: "src/app/*", name_from: dirname }
    - { side: be, root_match: backend,  glob: "*/app/Http/Controllers/*Controller.php",
        name_from: basename, strip_suffix: "Controller.php", label_with_parent: true }
  pair_by: route                # FE route ↔ BE controller ชื่อไม่ตรง — ไล่จาก src/api → routes/api.php
  # exclude = "ไม่ใช่ฟีเจอร์" เท่านั้น · หน้า content นิ่ง (about-us/faqs/privacy-policy/how-to-order)
  # ให้เข้าทะเบียนแล้ว mark risk: skip พร้อมเหตุผล จะได้เห็นว่ารู้จักแต่ตั้งใจไม่ทำ
  exclude: ["[...slug]", theme, Controller.php, Base.php]
  notes: >
    WNW ทำ /gen-testcases ครบทั้งเว็บแล้ว 15 ไฟล์ใน docs/generated/ — scout ควรเจอว่า module ส่วนใหญ่
    มี draft เทสเคสอยู่แล้ว (spec_hits) เหลือแค่สาย /gen-automation
    · FE มี route ตระกูล line/openline หลายตัวที่เป็น redirect ล้วน → risk: skip


# นามสกุลไฟล์ที่อ่าน
include_ext: [.ts, .tsx, .js, .jsx, .py, .php, .go, .java, .vue]

# โฟลเดอร์/ไฟล์ที่ข้าม (กัน node_modules, build, และความลับ)
ignore_dirs: [node_modules, .git, .next, dist, build, out, coverage, vendor,
              __pycache__, .turbo, .cache, public, assets, storybook-static, .vercel]
ignore_globs: ["*.env*", "*.lock", "*.min.*", "*.map", "*.snap",
               "*.test.*", "*.spec.*", "*.d.ts", "*.config.js"]

# โฟลเดอร์ที่ให้คะแนนพิเศษ (โค้ดที่มักมีกติกาให้ทดสอบ)
signal_dirs: [app, pages, components, features, checkout, cart, coupon, promo, promotion,
              payment, order, orders, auth, login, register, tracking, product, products,
              validation, validators, schema, schemas, dto, service, services, api,
              hooks, store, controllers, models, rules]

# งบในการป้อนโค้ดให้ AI (คุมต้นทุน token)
max_files: 25
max_total_chars: 120000
